<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pickle Fever</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <canvas id="game" aria-label="Pickleball court"></canvas>

    <div id="hud" aria-live="polite">
      <div class="side"><span class="label">YOU</span><span id="score-player">0</span></div>
      <div class="side"><span id="score-cpu">0</span><span class="label" id="cpu-label">CPU</span></div>
    </div>

    <section class="screen" id="screen-menu">
      <h1>PICKLE FEVER</h1>
      <p class="sub" id="menu-sub">You vs CPU &middot; first to 7</p>
      <div class="buttons">
        <button data-action="play">Play</button>
        <button data-action="controls">Controls</button>
      </div>
    </section>

    <section class="screen hidden" id="screen-difficulty">
      <h2>Choose difficulty</h2>
      <div class="buttons">
        <button data-difficulty="easy">Easy</button>
        <button data-difficulty="medium">Medium</button>
        <button data-difficulty="hard">Hard</button>
        <button data-action="menu" class="secondary">Back</button>
      </div>
    </section>

    <section class="screen hidden" id="screen-controls">
      <h2>Controls</h2>
      <ul class="controls">
        <li><kbd>W</kbd> / <kbd>S</kbd> or <kbd>&uarr;</kbd> / <kbd>&darr;</kbd> &mdash; move paddle</li>
        <li>Mouse or touch &mdash; drag the paddle</li>
        <li><kbd>Esc</kbd> / <kbd>P</kbd> &mdash; pause</li>
        <li><kbd>M</kbd> &mdash; toggle sound</li>
      </ul>
      <div class="buttons">
        <button data-action="menu" class="secondary">Back</button>
      </div>
    </section>

    <section class="screen hidden" id="screen-pause">
      <h2>Paused</h2>
      <div class="buttons">
        <button data-action="resume">Resume</button>
        <button data-action="quit" class="secondary">Main menu</button>
      </div>
    </section>

    <section class="screen hidden" id="screen-over">
      <h2 id="over-title">You win!</h2>
      <p class="sub" id="over-score"></p>
      <div class="buttons">
        <button data-action="again">Play again</button>
        <button data-action="play">Change difficulty</button>
        <button data-action="quit" class="secondary">Main menu</button>
      </div>
    </section>

    <button id="pause-btn" class="hidden" aria-label="Pause">II</button>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
